[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lumbr"
version = "0.1.0"
description = "Evaluating retrieval strategies and fine-tuning for a RAG assistant over company-internal knowledge (CISC 6000, Group 10)"
requires-python = ">=3.10"
# Core deps only. Heavy, track-specific packages (pyserini, faiss, vllm, ragas, ranx)
# are added as optional extras when each track starts, so the bootstrap stays fast.
dependencies = [
    "huggingface_hub>=0.24",
    "datasets>=2.20",
    "pandas>=2.0",
    "pyarrow>=15",
    "tqdm",
    "transformers>=4.40",   # tokenizers only (chunk token counts); models load in track notebooks
]

[project.optional-dependencies]
retrieval = ["sentence-transformers>=3.0", "faiss-cpu", "ranx"]
bm25 = ["pyserini", "ranx"]
train = ["sentence-transformers>=3.0", "accelerate", "datasets"]
subsample = ["scikit-learn>=1.3", "scipy", "sentence-transformers>=3.0"]
# 0.34.0 fails at start-up ("No module named 'cutlass'")
generate = ["vllm<0.34"]
# the demo search service (demo/backend); its tests run in CI
demo = ["fastapi>=0.110", "httpx", "numpy", "onnxruntime", "tokenizers", "uvicorn"]
# the B0 search server: R1 BM25 through Pyserini (needs Java 21+)
demo-b0 = ["pyserini", "faiss-cpu"]
# building the demo artifacts (demo/build): embeddings + ONNX export
demo-build = ["sentence-transformers>=3.0", "onnx", "onnxscript"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lumbr = ["prompts/*.json"]

[tool.pytest.ini_options]
pythonpath = ["demo/backend", "demo/build"]
markers = ["artifacts: needs demo/backend/artifacts built by demo/build/build_artifacts.py"]
