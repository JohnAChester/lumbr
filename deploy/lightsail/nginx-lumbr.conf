# Installed as /etc/nginx/sites-available/lumbr (symlinked into sites-enabled).
# This is the pre-HTTPS version. `certbot --nginx --redirect` then adds the 443 listener,
# the certificate paths and the HTTP -> HTTPS redirect in place.
server {
    listen 80;
    listen [::]:80;
    server_name api.johnchester.dev;
    server_tokens off;
    client_max_body_size 64k;

    location / {
        limit_req zone=lumbr burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
